server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Live payload, pushed into the mounted volume every 10 min. Never cached:
    # a stale data.json would silently show yesterday's house.
    location = /data.json {
        alias /data/data.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # No payload yet (first deploy, or push broken): answer 204 rather than
        # 404 so the page can say "waiting for data" instead of showing an error.
        try_files $uri =204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The static assets are versioned by the image, so a redeploy must win over
    # whatever the browser kept.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }
}
